[workspace]
members = [
    "crates/sf-ir",
    "crates/sf-cat",
    "crates/sf-compiler",
    "crates/sf-router",
    "crates/sf-bindings",
    "crates/sf-pulse",
    "crates/sf-qec",
    "crates/sf-gpu",
]
resolver = "2"

[workspace.package]
version = "0.1.20"
edition = "2021"
# PyO3 0.30 and the numpy crate both require Rust 1.85+.
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Superfermion Team"]
description = "High-performance quantum computing framework with a Python API and Rust simulation core"
repository = "https://github.com/Catstate101/superfermion"
documentation = "https://github.com/Catstate101/superfermion"

[workspace.dependencies]
# Shared dependencies across all crates
petgraph = "0.6"
num-complex = { version = "0.4", features = ["serde"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
ndarray = "0.16"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }
indexmap = { version = "2.7", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
# abi3-py310 emits a cp310-abi3 wheel: one binary per platform runs on every
# GIL-enabled CPython >= 3.10, including future releases (3.15, 3.16, ...).
# That removes the per-interpreter wheel matrix and the "no wheel for my
# Python yet" fallback into the sdist.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"
rand = "0.8"
