[workspace]
members = [
    "crates/sf-ir",
    "crates/sf-compiler",
    "crates/sf-router",
    "crates/sf-bindings",
    "crates/sf-pulse",
    "crates/sf-qec",
    "crates/sf-gpu",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Superfermion Team"]
description = "The Holy Grail of Quantum ML — Hardware-agnostic quantum-classical framework"

[workspace.dependencies]
# Shared dependencies across all crates
petgraph = "0.6"
num-complex = { version = "0.4", features = ["serde"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
ndarray = "0.16"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }
indexmap = { version = "2.7", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rand = "0.8"
