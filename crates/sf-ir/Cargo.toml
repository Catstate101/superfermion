[package]
name = "sf-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Superfermion Quantum Intermediate Representation — DAG-based circuit representation"

[dependencies]
petgraph = { workspace = true }
num-complex = { workspace = true }
nalgebra = { workspace = true }
ndarray = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
# Pure-Rust BLAS-quality linear algebra. Used by the MPS path for QR
# decomposition + dense matmul at high bond dimension. Closes the
# Heisenberg/QFT/RandomUniversal gap vs Aer-MPS by ~5x.
faer = { version = "0.20", default-features = false, features = ["std", "rayon", "qr", "svd", "linalg"] }

[features]
default = []
gpu = ["sf-gpu"]

[dependencies.sf-gpu]
path = "../sf-gpu"
optional = true

[dev-dependencies]
approx = "0.5"
