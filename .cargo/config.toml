# Build the Rust core with x86-64-v2 as the portable baseline (SSE4.2 +
# SSSE3 + SSE3, supported on all x86_64 CPUs since ~2009). LLVM still
# auto-vectorizes the statevector kernel within this ISA subset, and the
# resulting binary runs everywhere — critical for pre-built PyPI wheels.
[build]
rustflags = ["-C", "target-cpu=x86-64-v2"]
