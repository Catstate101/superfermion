name: Superfermion CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust checks ──────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # pyo3 0.23 supports CPython up to 3.13, and ubuntu-latest now mixes in
      # Ubuntu 26.04 runners whose python3 is 3.14, so the pyo3-ffi build script
      # aborts before any crate is checked. Build against a pinned interpreter,
      # the same way the python matrix does, and point pyo3 at it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The runner images preinstall stable without clippy (Ubuntu 26.04 ships
      # cargo/rustc/rustfmt only), so rustup treats the toolchain as present and
      # `cargo clippy` dies with "no such command". Ask for the components
      # explicitly; rustup adds them to the preinstalled toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo check --all-targets --manifest-path crates/sf-ir/Cargo.toml
      - run: cargo fmt --check --all
      - name: cargo clippy
        shell: bash
        env:
          PYO3_PYTHON: python
        run: |
          set +e
          cargo clippy --workspace -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/clippy.log"
          if [ "$status" -ne 0 ]; then
            # Job logs need a GitHub login; check annotations do not, so put the
            # first diagnostics on the check run itself. cargo writes ANSI colour
            # (CARGO_TERM_COLOR=always), so strip it before matching.
            sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$RUNNER_TEMP/clippy.log" \
              > "$RUNNER_TEMP/clippy.clean"
            {
              grep -m 4 -E 'error(\[|:)|^warning' "$RUNNER_TEMP/clippy.clean" || true
              tail -n 4 "$RUNNER_TEMP/clippy.clean"
            } | awk '!seen[$0]++' | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=clippy::${line:0:900}"
              done
          fi
          exit "$status"
      - run: cargo test --workspace
        env:
          PYO3_PYTHON: python

  # ── Python checks ────────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build Rust extension
        shell: bash
        run: |
          pip install maturin
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Lint (ruff)
        run: ruff check superfermion/ --select=F --ignore=F401,F821
      - name: Type check (mypy)
        continue-on-error: true
        run: mypy superfermion/
      - name: Run core tests
        shell: bash
        run: |
          pip install scipy
          python -m pytest tests/ -q --timeout=120 \
            --ignore=tests/domain/test_gradients_full.py \
            -k "not (aer or qiskit or pennylane)"

  # ── Benchmark smoke test ─────────────────────────────────
  benchmarks:
    name: Benchmark smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Quick benchmark
        run: |
          python -c "import superfermion as sf; c=sf.Circuit(8).h(0).cx(0,1).cx(1,2).cx(2,3); r=sf.run(c,device='cpu',shots=0); print(f'OK: {len(r.statevector)} dims')"
