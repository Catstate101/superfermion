name: Superfermion CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust checks ──────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # pyo3 needs an interpreter to read headers from. The extension targets the
      # 3.10 stable ABI (abi3-py310), so which one is only a compile check: use a
      # recent release so a dependency dropping support for old headers shows up
      # here instead of in the release build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The runner images preinstall stable without clippy (Ubuntu 26.04 ships
      # cargo/rustc/rustfmt only), so rustup treats the toolchain as present and
      # `cargo clippy` dies with "no such command". Ask for the components
      # explicitly; rustup adds them to the preinstalled toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo check --all-targets --manifest-path crates/sf-ir/Cargo.toml
      - run: cargo fmt --check --all
      - name: cargo clippy
        shell: bash
        env:
          PYO3_PYTHON: python
        run: |
          set +e
          cargo clippy --workspace -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/clippy.log"
          if [ "$status" -ne 0 ]; then
            # Job logs need a GitHub login; check annotations do not, so put the
            # first diagnostics on the check run itself. cargo writes ANSI colour
            # (CARGO_TERM_COLOR=always), so strip it before matching.
            sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$RUNNER_TEMP/clippy.log" \
              > "$RUNNER_TEMP/clippy.clean"
            {
              grep -m 4 -E 'error(\[|:)|^warning' "$RUNNER_TEMP/clippy.clean" || true
              tail -n 4 "$RUNNER_TEMP/clippy.clean"
            } | awk '!seen[$0]++' | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=clippy::${line:0:900}"
              done
          fi
          exit "$status"
      - run: cargo test --workspace
        env:
          PYO3_PYTHON: python

  # ── Distribution artifacts ───────────────────────────────
  # pip installs the sdist whenever a wheel is missing for the platform, so the
  # tarball has to be as complete as the wheel. Maturin derives its file list
  # from the enabled cargo graph and silently drops crates behind optional path
  # dependencies; 0.1.16 shipped without crates/sf-gpu and every source install
  # died in manifest loading. Assert completeness on the artifact, every push.
  sdist:
    name: sdist is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # python-version matters here: check_version.py needs tomllib (3.11+).
      - name: Versions agree (pyproject, Cargo.toml, __version__)
        run: python scripts/check_version.py
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist
      - name: Every crate, path dependency and include asset must be inside
        run: python scripts/check_sdist.py dist

  wheel:
    name: Wheel is one stable-ABI artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Tag must be cp310-abi3 (one wheel for 3.10 and later)
        shell: python
        run: |
          import glob

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          name = wheels[0].replace("\\", "/").rsplit("/", 1)[-1]
          assert "cp310-abi3" in name, name
          print("wheel tag OK:", name)
      - name: Install the wheel into a clean environment and import it
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip numpy
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index --only-binary=:all: --find-links dist superfermion
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import superfermion as sf; s=sf.simulate(sf.Circuit(4).h(0).cx(0,1)); assert len(s.numpy())==16"
          # The metadata and the importable package must not disagree.
          "$RUNNER_TEMP/venv/bin/python" -c "import importlib.metadata as m, superfermion as sf; assert sf.__version__ == m.version('superfermion'), (sf.__version__, m.version('superfermion')); print('runtime version OK:', sf.__version__)"

  # ── Python checks ────────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 is still allowed to be a pre-release; the abi3 wheel does not
          # care which interpreter builds it, the tests do.
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install builds the abi3 extension into the source tree, so
          # the suite below exercises the code in this checkout.
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check superfermion/ scripts/ --select=F --ignore=F401,F821
      - name: Type check (mypy)
        continue-on-error: true
        run: mypy superfermion/
      - name: Run core tests
        shell: bash
        run: |
          pip install scipy
          python -m pytest tests/ -q --timeout=120 \
            --ignore=tests/domain/test_gradients_full.py \
            -k "not (aer or qiskit or pennylane)"

  # ── Free-threaded CPython ────────────────────────────────
  # A limited API does not exist for free-threaded builds before 3.15, so no
  # prebuilt wheel is published for 3.14t/3.15t. pip falls back to the sdist,
  # pyo3 sees Py_GIL_DISABLED and emits a version-specific cp314t extension
  # instead of an abi3 one. This lane keeps that fallback honest; once it is
  # green, adding cp314t-* to CIBW_BUILD in release.yml publishes wheels too.
  free-threaded:
    name: Free-threaded CPython 3.14t (from source)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install from source (no wheel exists for this ABI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import and run outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "import sys, superfermion as sf; assert sys._is_gil_enabled() is False; s=sf.simulate(sf.Circuit(4).h(0).cx(0,1)); assert len(s.numpy())==16; print('free-threaded OK', sys.version.split()[0])"

  # ── Benchmark smoke test ─────────────────────────────────
  benchmarks:
    name: Benchmark smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Quick benchmark
        run: |
          python -c "import superfermion as sf; c=sf.Circuit(8).h(0).cx(0,1).cx(1,2).cx(2,3); r=sf.run(c,device='cpu',shots=0); print(f'OK: {len(r.statevector)} dims')"
