name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI?'
        type: boolean
        default: false

jobs:
  # ---- Build wheels for all platforms and Python versions ----

  # Linux: cibuildwheel builds all Python versions inside manylinux_2_28 container
  build-linux-wheels:
    name: Build Linux wheels (py3.10–3.13, manylinux_2_28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tag matches pyproject version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PY_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version: $VERSION"
          echo "Package version: $PY_VERSION"
          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "Tag version ($VERSION) does not match pyproject.toml version ($PY_VERSION)"
            exit 1
          fi

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_FRONTEND: build
          CIBW_BEFORE_ALL: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/

  # macOS & Windows: maturin-action, one matrix entry per Python version
  build-platform-wheels:
    name: Build ${{ matrix.os }} wheel (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: '3.10'
            maturin-args: --release --out dist --target universal2-apple-darwin
          - os: macos-latest
            python-version: '3.11'
            maturin-args: --release --out dist --target universal2-apple-darwin
          - os: macos-latest
            python-version: '3.12'
            maturin-args: --release --out dist --target universal2-apple-darwin
          - os: macos-latest
            python-version: '3.13'
            maturin-args: --release --out dist --target universal2-apple-darwin
          - os: windows-latest
            python-version: '3.10'
            maturin-args: --release --out dist
          - os: windows-latest
            python-version: '3.11'
            maturin-args: --release --out dist
          - os: windows-latest
            python-version: '3.12'
            maturin-args: --release --out dist
          - os: windows-latest
            python-version: '3.13'
            maturin-args: --release --out dist

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust extension wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: ${{ matrix.maturin-args }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  # ---- Test built wheel before publish ----
  test-wheel:
    name: Test wheel
    needs: [build-linux-wheels, build-platform-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Install wheel and run tests
        run: |
          pip install pytest pytest-timeout pytest-benchmark numpy scipy boto3
          pip install dist/*linux*.whl
          # Remove local source so it doesn't shadow the installed package
          rm -rf superfermion/
          python -m pytest tests/ -q --timeout=120 \
            --ignore=tests/domain/test_gradients_full.py \
            --ignore=tests/integration/test_provider_adapters.py \
            --ignore=tests/integration/test_tracked_experiment.py \
            -k "not (aer or qiskit or pennylane or braket or test_decomposes_swap)"

  # ---- Publish to PyPI ---- 
  publish:
    name: Publish to PyPI
    needs: [build-linux-wheels, build-platform-wheels, test-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/superfermion
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
