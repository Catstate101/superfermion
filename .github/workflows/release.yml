name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI?'
        type: boolean
        default: false

jobs:
  # ---- Build wheels for all platforms ---- 
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            maturin-args: --release --out dist
          - os: macos-latest
            target: universal2-apple-darwin
            maturin-args: --release --out dist --target universal2-apple-darwin
          - os: windows-latest
            target: x64
            maturin-args: --release --out dist

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tag matches pyproject version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PY_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version: $VERSION"
          echo "Package version: $PY_VERSION"
          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "Tag version ($VERSION) does not match pyproject.toml version ($PY_VERSION)"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust extension wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: ${{ matrix.maturin-args }}
          working-directory: crates/sf-bindings
          manylinux: auto

      - name: Build Python sdist with maturin
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/sf-bindings

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  # ---- Test built wheel before publish ----
  test-wheel:
    name: Test wheel
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Install wheel and run tests
        run: |
          pip install pytest pytest-timeout
          pip install dist/*.whl
          python -m pytest tests/ -q --timeout=120 -k "not (aer or qiskit or pennylane)"

  # ---- Publish to PyPI ---- 
  publish:
    name: Publish to PyPI
    needs: [build-wheels, test-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/superfermion
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
