name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI?'
        type: boolean
        default: false

# The extension is built against the CPython stable ABI (pyo3 `abi3-py310`),
# so each platform ships ONE wheel tagged cp310-abi3. That wheel installs and
# runs on every GIL-enabled CPython >= 3.10, including interpreters released
# after it was built (3.15 and later). Build with 3.10 so the ABI floor stays
# 3.10; do not reintroduce per-interpreter wheel jobs.
env:
  CIBW_BUILD: "cp310-*"
  CIBW_BUILD_FRONTEND: "build"

jobs:
  # ---- Verify metadata before anything is built ----
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Versions agree, and the build targets the stable ABI
        shell: bash
        run: |
          # Tag, pyproject, Cargo.toml and superfermion.__version__ -- the last
          # one is what users see at runtime and is easy to forget on a bump.
          python scripts/check_version.py
          python - <<'PY'
          import tomllib

          pyproject = tomllib.load(open("pyproject.toml", "rb"))
          features = pyproject["tool"]["maturin"]["features"]

          assert any(f.startswith("pyo3/abi3-py") for f in features), features

          requires_python = pyproject["project"]["requires-python"]
          assert "<" not in requires_python, (
              f"requires-python {requires_python!r} has an upper bound, which keeps "
              "the wheel out of interpreters released after it was built"
          )
          print("abi3 feature and requires-python OK")
          PY

  # ---- Source distribution: complete, self-contained, metadata-resolvable ----
  sdist:
    name: Build and verify sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Sdist must be self-contained (crates, path deps, include assets)
        run: python scripts/check_sdist.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  # ---- Prove the sdist builds end to end on the oldest and newest Python ----
  test-sdist:
    name: Install from sdist (py${{ matrix.python-version }})
    needs: sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported interpreter: the ends of the range the
        # abi3 wheel claims to cover, built the slow way.
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: dtolnay/rust-toolchain@stable

      - name: pip install from sdist
        run: python -m pip install dist/*.tar.gz

      - name: Import and smoke test
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "import superfermion as sf; c=sf.Circuit(6).h(0).cx(0,1).cx(1,2); r=sf.run(c, device='cpu', shots=0); assert len(r.statevector) == 64; print('sdist OK on', __import__('sys').version.split()[0])"

  # ---- Wheels: one abi3 build per platform/arch ----
  build-linux:
    name: Linux wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # cibuildwheel 4 only expands the names manylinux2014,
          # manylinux_2_28 and manylinux_2_34 (or a full docker image name);
          # anything else is handed to docker verbatim, which is how the PEP 600
          # spelling "manylinux_2_17" failed before it built anything.
          # manylinux_2_28 is the v4 default: AlmaLinux 8, glibc 2.28.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          # manylinux images already ship a Rust toolchain; musllinux (Alpine)
          # may ship neither rustup nor curl, so bootstrap both when needed.
          CIBW_BEFORE_ALL_LINUX: |
            set -e
            if ! command -v cargo >/dev/null 2>&1; then
              command -v curl >/dev/null 2>&1 || apk add --no-cache curl
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            fi
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python -c "import superfermion as sf; c=sf.Circuit(4).h(0).cx(0,1); r=sf.run(c,device='cpu',shots=0); assert len(r.statevector)==16; print('wheel OK')"

      - name: Assert this arch shipped one stable-ABI wheel per libc
        run: python3 scripts/check_wheels.py wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/

  build-macos:
    name: macOS wheels (universal2)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --target universal2-apple-darwin

      - name: Assert the wheel tag
        run: python scripts/check_wheels.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist/

  build-windows:
    name: Windows wheels (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Assert the wheel tag
        run: python scripts/check_wheels.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-amd64
          path: dist/

  build-windows-arm64:
    name: Windows wheels (arm64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      # Python 3.10 has no official Windows/arm64 installer; maturin still
      # tags the wheel cp310-abi3 because the abi3 floor comes from pyo3.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'arm64'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - run: python -m pip install maturin
      - run: maturin build --release --out dist

      - name: Assert the wheel tag
        run: python scripts/check_wheels.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-arm64
          path: dist/

  # ---- The wheel must install on every Python version we claim to support ----
  test-abi3:
    name: abi3 install (py${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [build-linux, build-macos, build-windows, build-windows-arm64]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-11-arm
            python-version: "3.12"
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install wheel only (no sdist fallback allowed)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --no-index --only-binary=:all: --find-links dist superfermion

      - name: Import and smoke test from outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "import superfermion as sf; c=sf.Circuit(6).h(0).cx(0,1).cx(1,2); r=sf.run(c,device='cpu',shots=0); assert len(r.statevector)==64; print('abi3 OK', sf.__version__)"
          # Wheel metadata and the importable package must agree on the version.
          python -c "import importlib.metadata as m, superfermion as sf; have, want = sf.__version__, m.version('superfermion'); assert have == want, (have, want)"

  # ---- Full suite against the shipped wheel on the newest interpreter ----
  test-wheel-suite:
    name: Full test suite against abi3 wheel (py3.15)
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # pytest 9 and pytest-benchmark 5.3 are an incompatible pair: the
          # plugin reads Function._nodeid, which pytest 9 removed, so all 21
          # benchmark tests error during fixture setup. The ceiling holds until
          # a plugin release supports pytest 9.
          python -m pip install numpy scipy "pytest>=7,<9" pytest-timeout pytest-benchmark
          # The suite guards framework tests with importorskip. Installing them
          # here is what makes this lane assert interop behaviour instead of
          # skipping it. cirq-core and TensorFlow are the exceptions: neither has
          # a wheel for this lane's 3.15, so they carry markers below and the
          # 3.12 `interop` job runs those tests for real.
          python -m pip install qiskit qiskit-ibm-runtime pennylane \
            stim jax flax boto3 amazon-braket-sdk matplotlib torch
          # cirq-core pulls tensorstore, which publishes no 3.15 wheel, so pip
          # falls back to a Bazel source build that fails before a test runs.
          python -m pip install "cirq-core; python_version < '3.15'"
          # TensorFlow has no wheel for 3.13 or newer, so on this lane's 3.15 the
          # marker keeps it out by design; the 3.12 `interop` job runs that test.
          python -m pip install "tensorflow>=2.15; python_version < '3.13'"
          # pyscf is deliberately absent from this gate. Its two chemistry tests
          # (reference-vs-SCF energy in test_chemistry.py, symmetry-sector FCI in
          # test_chemistry_parity.py) need a Linux wheel and have never executed
          # in any lane, so they would first run here, at publish time, where a
          # failure costs a release. They run in the `interop` job on every PR
          # instead. Once that has passed once, promote them into this gate by
          # adding this to the line above:
          #     "pyscf>=2.3; sys_platform != 'win32'"
          python -m pip install --no-index --only-binary=:all: --find-links dist superfermion

      - name: Run tests against the installed wheel
        shell: bash
        run: |
          # Remove local source so it doesn't shadow the installed package
          rm -rf superfermion/
          # No -k and no --ignore: this lane installs what the suite needs on this
          # interpreter, so a skip means the environment lost a dependency --
          # except cirq and TensorFlow, which are gated above by version.
          python -m pytest tests/ -q --timeout=120

  # ---- Publish ----
  publish:
    name: Publish to PyPI
    needs:
      - validate
      - sdist
      - test-sdist
      - build-linux
      - build-macos
      - build-windows
      - build-windows-arm64
      - test-abi3
      - test-wheel-suite
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    environment:
      name: pypi
      url: https://pypi.org/p/superfermion
    permissions:
      # Job-level permissions replace the defaults rather than adding to them.
      # Without contents: read the checkout below gets a token that cannot see
      # a private repository and dies with "repository not found", which is
      # what blocked the v0.1.18 upload before it reached PyPI.
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Gate the upload set (every platform, one stable-ABI tag, complete sdist)
        run: |
          ls -la dist/
          python scripts/check_wheels.py dist --require-platforms
          python scripts/check_sdist.py dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
